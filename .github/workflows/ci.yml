name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR commits can stop. Each main push still gets its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make backend-static license-check openapi-check web-check

  backend-tests:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: transfers
            args: tests/finance/transfers
          - suite: binance
            args: tests/finance/binance
          # Keep discovery open so new test directories run automatically.
          - suite: remaining
            args: --ignore=tests/finance/transfers --ignore=tests/finance/binance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
      - run: make backend-test
        env:
          PYTEST_ARGS: --durations=10 ${{ matrix.args }}

  # The main ruleset requires this exact check name.
  check:
    if: ${{ always() }}
    needs: [quality, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.backend-tests.result }}
        run: '[[ "$QUALITY" == success && "$TESTS" == success ]]'
