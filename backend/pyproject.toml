[project]
name = "lararium"
version = "0.1.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "tzdata",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
    "pyright",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lararium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.13"

[tool.importlinter]
root_package = "lararium"

[[tool.importlinter.contracts]]
name = "core does not depend on modules or api"
type = "forbidden"
source_modules = ["lararium.core"]
forbidden_modules = ["lararium.modules", "lararium.api"]

[[tool.importlinter.contracts]]
name = "modules do not depend on api"
type = "forbidden"
source_modules = ["lararium.modules"]
forbidden_modules = ["lararium.api"]
