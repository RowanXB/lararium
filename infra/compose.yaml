name: lararium
# Required settings use ${VAR:?...}, so compose refuses to start when one is missing or
# empty. The db init scripts can't be the check: they run once, after initdb has made the
# volume permanent, and a failure there leaves a volume no later start can finish.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      LARARIUM_OWNER_PASSWORD: ${LARARIUM_OWNER_PASSWORD:?set LARARIUM_OWNER_PASSWORD in infra/.env}
      LARARIUM_BACKEND_PASSWORD: ${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}
      LARARIUM_WEBHOOK_IN_PASSWORD: ${LARARIUM_WEBHOOK_IN_PASSWORD:?set LARARIUM_WEBHOOK_IN_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres:/lararium:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: during first-start init the server listens on the socket only,
      # so this stays unhealthy until roles.sql has run and TCP is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lararium"]
      interval: 5s
      retries: 30
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      LARARIUM_MIGRATION_DATABASE_URL: postgresql+psycopg://lararium_owner:${LARARIUM_OWNER_PASSWORD:?set LARARIUM_OWNER_PASSWORD in infra/.env}@db:5432/lararium
    depends_on:
      db: { condition: service_healthy }
  # No published ports: only Caddy (web) reaches the api, over the compose network.
  api:
    build: ../backend
    restart: unless-stopped
    command: ["uvicorn", "lararium.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_backend:${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_AUTH_MODE: tailscale
      LARARIUM_OWNER_LOGIN: ${LARARIUM_OWNER_LOGIN:?set LARARIUM_OWNER_LOGIN in infra/.env}
      LARARIUM_MASTER_KEY: ${LARARIUM_MASTER_KEY:?set LARARIUM_MASTER_KEY in infra/.env}
      LARARIUM_PUBLIC_BASE_URL: ${LARARIUM_PUBLIC_BASE_URL:-}
      LARARIUM_WEBHOOK_BASE_URL: ${LARARIUM_WEBHOOK_BASE_URL:-}
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Runs the connection syncs and the periodic jobs. No ports; it only talks to the db and
  # to the providers.
  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "lararium.worker"]
    # Time to finish a running job, including the 4-minute approval wait, before being
    # killed; a job killed anyway is retried by the stalled-job task.
    stop_grace_period: 5m
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_backend:${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_AUTH_MODE: tailscale
      LARARIUM_OWNER_LOGIN: ${LARARIUM_OWNER_LOGIN:?set LARARIUM_OWNER_LOGIN in infra/.env}
      LARARIUM_MASTER_KEY: ${LARARIUM_MASTER_KEY:?set LARARIUM_MASTER_KEY in infra/.env}
      LARARIUM_PUBLIC_BASE_URL: ${LARARIUM_PUBLIC_BASE_URL:-}
      LARARIUM_WEBHOOK_BASE_URL: ${LARARIUM_WEBHOOK_BASE_URL:-}
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
      LARARIUM_FEISHU_WEBHOOK_URL: ${LARARIUM_FEISHU_WEBHOOK_URL:-}
      LARARIUM_FEISHU_SECRET: ${LARARIUM_FEISHU_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Webhook ingress, started only with `--profile webhook`. Compose interpolates inactive
  # services too, so their secrets can't be required (`:?`) without breaking a plain
  # `make up`; instead the receiver refuses to start without a valid secret, and
  # cloudflared without a token. The receiver can only insert
  # into the webhook inbox (role lararium_webhook_in). `python -m lararium.webhook_in` runs
  # uvicorn without access logs, which would otherwise record the secret in the URL path.
  webhook-in:
    build: ../backend
    restart: unless-stopped
    profiles: ["webhook"]
    command: ["python", "-m", "lararium.webhook_in"]
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_webhook_in:${LARARIUM_WEBHOOK_IN_PASSWORD:?set LARARIUM_WEBHOOK_IN_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    profiles: ["webhook"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [webhook-in]
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    # Loopback only: `tailscale serve` is the sole ingress and sets Tailscale-User-Login.
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  pgdata: {}
