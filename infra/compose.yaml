name: lararium
# Required settings use ${VAR:?...}, so compose refuses to start when one is missing or
# empty. The db init scripts can't be the check: they run once, after initdb has made the
# volume permanent, and a failure there leaves a volume no later start can finish.
# Networks keep the internet-facing services away from the api, which trusts the identity
# header of whatever reaches it: the webhook receiver reaches only the db (as a role that can
# only insert into the inbox), and cloudflared only the receiver. `inbox` and `tunnel` are
# internal, with no route out: on Docker Desktop any other network reaches the host's
# loopback, where web is published. cloudflared's way out to Cloudflare is `egress` alone.
networks:
  app: {}
  inbox: { internal: true }
  tunnel: { internal: true }
  egress: {}
services:
  db:
    image: postgres:18
    networks: [app, inbox]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      LARARIUM_OWNER_PASSWORD: ${LARARIUM_OWNER_PASSWORD:?set LARARIUM_OWNER_PASSWORD in infra/.env}
      LARARIUM_BACKEND_PASSWORD: ${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}
      LARARIUM_WEBHOOK_IN_PASSWORD: ${LARARIUM_WEBHOOK_IN_PASSWORD:?set LARARIUM_WEBHOOK_IN_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres:/lararium:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: during first-start init the server listens on the socket only,
      # so this stays unhealthy until roles.sql has run and TCP is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lararium"]
      interval: 5s
      retries: 30
  migrate:
    build: ../backend
    networks: [app]
    command: ["alembic", "upgrade", "head"]
    environment:
      LARARIUM_MIGRATION_DATABASE_URL: postgresql+psycopg://lararium_owner:${LARARIUM_OWNER_PASSWORD:?set LARARIUM_OWNER_PASSWORD in infra/.env}@db:5432/lararium
    depends_on:
      db: { condition: service_healthy }
  # No published ports: only Caddy (web) reaches the api, over the compose network.
  # Uploaded statements are kept in the `documents` volume; the api and the worker mount it.
  api:
    build: ../backend
    networks: [app]
    restart: unless-stopped
    # Statement PDFs are decoded in full in memory: a hostile one (a few MiB of compressed
    # zeros) could otherwise take the host's memory, the database's included. Parsing the
    # owner's real statements peaks under 200 MiB; past the cap only the api is killed, and
    # restarts.
    mem_limit: 1g
    volumes:
      - documents:/var/lib/lararium/documents
    command: ["uvicorn", "lararium.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_backend:${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_AUTH_MODE: tailscale
      LARARIUM_OWNER_LOGIN: ${LARARIUM_OWNER_LOGIN:?set LARARIUM_OWNER_LOGIN in infra/.env}
      LARARIUM_MASTER_KEY: ${LARARIUM_MASTER_KEY:?set LARARIUM_MASTER_KEY in infra/.env}
      LARARIUM_PUBLIC_BASE_URL: ${LARARIUM_PUBLIC_BASE_URL:-}
      LARARIUM_WEBHOOK_BASE_URL: ${LARARIUM_WEBHOOK_BASE_URL:-}
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
      # An IBKR statement upload reconciles in the api, and tells the owner from here.
      LARARIUM_FEISHU_WEBHOOK_URL: ${LARARIUM_FEISHU_WEBHOOK_URL:-}
      LARARIUM_FEISHU_SECRET: ${LARARIUM_FEISHU_SECRET:-}
      # Esplora server the Bitcoin wallet connector reads (the api previews and connects, the worker syncs).
      LARARIUM_ESPLORA_URL: ${LARARIUM_ESPLORA_URL:-https://mempool.space/api}
      LARARIUM_DOCUMENT_DIR: /var/lib/lararium/documents
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Runs the connection syncs and the periodic jobs. No ports; it only talks to the db and
  # to the providers.
  worker:
    build: ../backend
    networks: [app]
    restart: unless-stopped
    command: ["python", "-m", "lararium.worker"]
    # Time to finish a running job before being killed: the longest is an approval job, which
    # polls for 4 minutes, checks once more, then backfills until Monzo's 5-minute window
    # after the approval closes (about 9m40s), and still has to write that history to the
    # ledger and commit. A job killed anyway is retried by the stalled-job task, but a killed
    # backfill can't be repeated outside the window, so the approval would be lost.
    stop_grace_period: 15m
    # Fetched IBKR statements are kept as documents, in the volume the api uses.
    volumes:
      - documents:/var/lib/lararium/documents
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_backend:${LARARIUM_BACKEND_PASSWORD:?set LARARIUM_BACKEND_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_AUTH_MODE: tailscale
      LARARIUM_OWNER_LOGIN: ${LARARIUM_OWNER_LOGIN:?set LARARIUM_OWNER_LOGIN in infra/.env}
      LARARIUM_MASTER_KEY: ${LARARIUM_MASTER_KEY:?set LARARIUM_MASTER_KEY in infra/.env}
      LARARIUM_PUBLIC_BASE_URL: ${LARARIUM_PUBLIC_BASE_URL:-}
      LARARIUM_WEBHOOK_BASE_URL: ${LARARIUM_WEBHOOK_BASE_URL:-}
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
      LARARIUM_FEISHU_WEBHOOK_URL: ${LARARIUM_FEISHU_WEBHOOK_URL:-}
      LARARIUM_FEISHU_SECRET: ${LARARIUM_FEISHU_SECRET:-}
      # Esplora server the Bitcoin wallet connector reads (the api previews and connects, the worker syncs).
      LARARIUM_ESPLORA_URL: ${LARARIUM_ESPLORA_URL:-https://mempool.space/api}
      # Optional: prices assets Binance's own markets cannot. Without it they show no price.
      LARARIUM_COINGECKO_API_KEY: ${LARARIUM_COINGECKO_API_KEY:-}
      LARARIUM_DOCUMENT_DIR: /var/lib/lararium/documents
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Webhook ingress, in the stack only with COMPOSE_PROFILES=webhook in infra/.env, so that
  # `make up` rebuilds it and `make down` stops it like the rest. Compose interpolates inactive
  # services too, so their secrets can't be required (`:?`) without breaking a plain
  # `make up`; instead the receiver refuses to start without a valid secret, and
  # cloudflared without a token. The receiver can only insert
  # into the webhook inbox (role lararium_webhook_in). `python -m lararium.webhook_in` runs
  # uvicorn without access logs, which would otherwise record the secret in the URL path.
  webhook-in:
    build: ../backend
    networks: [inbox, tunnel]
    restart: unless-stopped
    profiles: ["webhook"]
    command: ["python", "-m", "lararium.webhook_in"]
    environment:
      LARARIUM_DATABASE_URL: postgresql+psycopg://lararium_webhook_in:${LARARIUM_WEBHOOK_IN_PASSWORD:?set LARARIUM_WEBHOOK_IN_PASSWORD in infra/.env}@db:5432/lararium
      LARARIUM_WEBHOOK_SECRET: ${LARARIUM_WEBHOOK_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    networks: [tunnel, egress]
    restart: unless-stopped
    profiles: ["webhook"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [webhook-in]
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    networks: [app]
    # Loopback only: `tailscale serve` is the sole ingress and sets Tailscale-User-Login.
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  pgdata: {}
  documents: {}
