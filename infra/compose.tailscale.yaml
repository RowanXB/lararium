# Ingress through a Tailscale sidecar (LARARIUM_INGRESS=tailscale): its own tailnet node
# serves web, so nothing is published on the host and the LAN has no way in, whatever the
# Docker version. Same images and API code as compose.host.yaml: both deliver the caller's
# identity in Tailscale-User-Login. The node logs in once with TS_AUTHKEY and keeps its
# identity in the tailscale-state volume, so the key is not needed after the first start.
networks:
  # Only the sidecar and web; not internal, as the sidecar reaches Tailscale's servers.
  ingress: {}
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: lararium
    networks: [ingress]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: lararium
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [web]
  web:
    networks: [app, ingress]
volumes:
  tailscale-state: {}
